<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Add Workout</title>
</head>
<body>
    <h1>Add Workout Test</h1>
    <form action="/user/saveworkout" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div>
            <label>Workout Name:</label>
            <input type="text" name="workoutName" required>
        </div>
        <div>
            <label>Duration:</label>
            <input type="text" name="duration" required>
        </div>
        <div>
            <label>Burned Calories:</label>
            <input type="text" name="burnedCalories" required>
        </div>
        <button type="submit">Save Workout</button>
    </form>
</body>
</html>
