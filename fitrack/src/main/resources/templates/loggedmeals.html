<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles/Fitrack.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <script src="/styles/scripts/dashboard.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link rel="icon" type="image/x-icon" href="/images/Fitrack.ico">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo-container">
                <img src="/images/Fitrack.png" alt="Fitrack Logo" class="logo" style="background:none;" />
                <span class="site-name">Fitrack</span>
            </div>
            <div class="user-info">
                <span th:text="${fullName}" class="user-name"></span>
                <div class="user-icon" onclick="toggleDropdown()">
                    <img th:if="${user.profilePicture}" th:src="${user.profilePicture}" class="profile-picture" alt="Profile Picture">
                    <img th:unless="${user.profilePicture}" src="/images/default-profile.png" class="profile-picture" alt="Default Profile Picture">
                </div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <form id="logoutForm" action="/user/logout" method="post" style="display: none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="submit" value="Logout" />
                    </form>
                    <a href="/user/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="/user/analytics"><i class="fas fa-chart-line"></i> Analytics</a>
                    <a href="/user/goals/all"><i class="fas fa-bullseye"></i> Goals</a>
                  <!--  <a href="/user/diet">Diet</a> -->
                    <a href="#" onclick="document.getElementById('logoutForm').submit();"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
            </div>
        </header>
        <main>
            <div class="page-header">
                <h2>Logged Meals</h2>
                <button class="add-button" onclick="openMealModal()">+</button>
            </div>

            <div class="meals-container">
                <!-- Today's Meals Section -->
                <div class="meal-section">
                    <div class="today-header">
                        <h2>Today's Meals</h2>
                        <div class="today-summary">
                            <div class="summary-item">
                                Total Calories: <span class="summary-value" th:text="${#aggregates.sum(todayMeals.![totalCalories])} + ' cal'">0 cal</span>
                            </div>
                            <div class="summary-item">
                                Meals: <span class="summary-value" th:text="${#lists.size(todayMeals)}">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="meals-grid">
                        <div th:if="${#lists.isEmpty(todayMeals)}" class="meal-card empty-state">
                            <h3>No meals logged today</h3>
                            <p>Click the + button to log a new meal</p>
                        </div>
                        <div th:each="meal : ${todayMeals}" class="meal-card">
                            <div class="meal-header">
                                <h3 th:text="${meal.mealName}">Meal Name</h3>
                                <div class="meal-actions">
                                    <a href="javascript:void(0)" th:onclick="'editMeal(' + ${meal.id} + ')'" class="action-icon edit-icon" title="Edit Meal">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a href="javascript:void(0)" th:onclick="'deleteMeal(' + ${meal.id} + ')'" class="action-icon delete-icon" title="Delete Meal">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </div>
                            </div>
                            <div class="meal-details">
                                <div class="meal-info-row">
                                    <span class="meal-calories" th:text="${meal.totalCalories} + ' calories'">Calories</span>
                                    <span class="meal-time" th:text="${#temporals.format(meal.dateTime, 'h:mm a')}">Time</span>
                                </div>
                                <div class="meal-foods">
                                    <div th:each="foodItem : ${meal.foodItems}" class="food-item">
                                        <span class="food-item-name" th:text="${foodItem.foodItem}"></span>
                                        <span class="food-item-calories" th:text="${foodItem.calories} + ' cal'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Past Meals Section -->
                <div class="meal-section">
                    <h3 class="section-title">Past Meals</h3>
                    <div th:each="dateEntry : ${pastMealsByDate}" class="date-group">
                        <div class="date-header">
                            <span class="date-title" th:text="${#temporals.format(dateEntry.key, 'EEEE, MMMM d, yyyy')}">Date</span>
                            <span class="date-summary">
                                Total: <span class="date-calories" th:text="${#aggregates.sum(dateEntry.value.![totalCalories])} + ' cal'">0 cal</span>
                            </span>
                        </div>
                        <div class="meals-grid">
                            <div th:each="meal : ${dateEntry.value}" class="meal-card">
                                <div class="meal-header">
                                    <h3 th:text="${meal.mealName}">Meal Name</h3>
                                    <div class="meal-actions">
                                        <a href="javascript:void(0)" th:onclick="'editMeal(' + ${meal.id} + ')'" class="action-icon edit-icon" title="Edit Meal">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a href="javascript:void(0)" th:onclick="'deleteMeal(' + ${meal.id} + ')'" class="action-icon delete-icon" title="Delete Meal">
                                            <i class="fas fa-trash-alt"></i>
                                        </a>
                                    </div>
                                </div>
                                <div class="meal-details">
                                    <div class="meal-info-row">
                                        <span class="meal-calories" th:text="${meal.totalCalories} + ' calories'">Calories</span>
                                        <span class="meal-time" th:text="${#temporals.format(meal.dateTime, 'h:mm a')}">Time</span>
                                    </div>
                                    <div class="meal-foods">
                                        <div th:each="foodItem : ${meal.foodItems}" class="food-item">
                                            <span class="food-item-name" th:text="${foodItem.foodItem}"></span>
                                            <span class="food-item-calories" th:text="${foodItem.calories} + ' cal'"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Meal Modal -->
    <div id="mealModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMealModal()">&times;</span>
            <h2 id="modalTitle">Log New Meal</h2>
            <form id="mealForm" action="/user/savemeal" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" id="mealId">
                <div class="form-group">
                    <label>Meal name</label>
                    <input type="text" name="mealName" id="mealName" placeholder="Enter meal name" required>
                </div>
                <div class="form-group">
                    <label>Time</label>
                    <input type="datetime-local" name="dateTime" id="dateTime" required>
                </div>
                <div class="form-group">
                    <label>Foods</label>
                    <div id="foodItemsContainer">
                        <div class="food-item-input">
                            <input type="text" name="foodNames[]" placeholder="Food name" required>
                            <input type="number" name="foodCalories[]" placeholder="Calories" required>
                            <button type="button" class="remove-item" onclick="removeFoodItem(this)">×</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addFoodItem()">Add Food Item</button>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeMealModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Meal</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/styles/scripts/dashboard.js}"></script>
    <script>
        function openMealModal() {
            document.getElementById('mealModal').style.display = 'flex';
            document.getElementById('mealForm').reset();
            document.getElementById('mealId').value = '';
            document.getElementById('modalTitle').textContent = 'Log New Meal';
            document.getElementById('mealForm').action = '/user/savemeal';
        }

        function closeMealModal() {
            document.getElementById('mealModal').style.display = 'none';
        }

        function addFoodItem() {
            const container = document.getElementById('foodItemsContainer');
            const foodItem = document.createElement('div');
            foodItem.className = 'food-item-input';
            foodItem.innerHTML = `
                <input type="text" name="foodNames[]" placeholder="Food name" required>
                <input type="number" name="foodCalories[]" placeholder="Calories" required>
                <button type="button" class="remove-item" onclick="removeFoodItem(this)">×</button>
            `;
            container.appendChild(foodItem);
        }

        function removeFoodItem(button) {
            button.parentElement.remove();
        }

        function editMeal(id) {
            const csrfToken = document.querySelector('input[name="_csrf"]').value;
            // Show loading state
            const editIcon = document.querySelector(`a[onclick="editMeal(${id})"]`);
            const originalIcon = editIcon.innerHTML;
            editIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            fetch(`/user/meals/${id}`, {
                headers: {
                    'X-CSRF-TOKEN': csrfToken,
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to load meal details');
                }
                return response.json();
            })
            .then(meal => {
                document.getElementById('mealId').value = meal.id;
                document.getElementById('mealName').value = meal.mealName;
                document.getElementById('dateTime').value = meal.dateTime;

                const container = document.getElementById('foodItemsContainer');
                container.innerHTML = '';

                meal.foodItems.forEach(foodItem => {
                    const foodItemDiv = document.createElement('div');
                    foodItemDiv.className = 'food-item-input';
                    foodItemDiv.innerHTML = `
                        <input type="text" name="foodNames[]" value="${foodItem.foodItem}" required>
                        <input type="number" name="foodCalories[]" value="${foodItem.calories}" required>
                        <button type="button" class="remove-item" onclick="removeFoodItem(this)">×</button>
                    `;
                    container.appendChild(foodItemDiv);
                });

                document.getElementById('modalTitle').textContent = 'Edit Meal';
                document.getElementById('mealForm').action = `/user/meals/${id}/update`;
                document.getElementById('mealModal').style.display = 'flex';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error loading meal details. Please try again.');
            })
            .finally(() => {
                // Restore original icon
                editIcon.innerHTML = originalIcon;
            });
        }

        function deleteMeal(id) {
            if (confirm('Are you sure you want to delete this meal?')) {
                const csrfToken = document.querySelector('input[name="_csrf"]').value;
                
                // Show loading state
                const deleteIcon = document.querySelector(`a[onclick="deleteMeal(${id})"]`);
                const originalIcon = deleteIcon.innerHTML;
                deleteIcon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                
                fetch(`/user/meals/${id}/delete`, {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': csrfToken,
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        throw new Error('Failed to delete meal');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting meal. Please try again.');
                    // Restore original icon
                    deleteIcon.innerHTML = originalIcon;
                });
            }
        }
    </script>
</body>
</html>
