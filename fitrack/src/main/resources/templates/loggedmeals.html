<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/styles/Fitrack.css}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script th:inline="javascript">
            /*<![CDATA[*/
                const contextPath = /*[[@{/}]]*/ '';
            /*]]>*/
        </script>
        <script th:src="@{/styles/scripts/loggedmeals.js}" defer></script>
        <script th:src="@{/styles/scripts/dashboard.js}" defer></script>
        <link rel="icon" type="image/x-icon" th:href="@{/images/Fitrack.ico}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <title>Meals</title>
    </head>
<body>
    <div class="container">
        <div th:replace="~{header :: navbar}"></div>
        <main>
            <div class="page-header">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <h2>Logged Meals</h2>
                    <button class="add-button" onclick="openMealModal()">+</button>
                </div>
            </div>

            <div class="log-container">
                <div th:if="${groupedMeals == null or groupedMeals.isEmpty()}" class="empty-state">
                    <h3>No meals logged yet.</h3>
                    <p>Click the + button to log a new meal.</p>
                </div>

                <div th:unless="${groupedMeals == null or groupedMeals.isEmpty()}" class="timeline">
                    <div th:each="entry : ${groupedMeals}" class="timeline-group">
                        <div class="timeline-date-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <span th:text="${#temporals.format(entry.key, 'EEEE, MMMM dd, yyyy')}">Date Header</span>
                            <span class="date-summary">
                                Total Consumed: <span class="date-calories" th:text="${#aggregates.sum(entry.value.![totalCalories])} + ' kcal'">0 kcal</span>
                            </span>
                        </div>
                        <ul class="timeline-entries">
                            <li th:each="meal : ${entry.value}" class="timeline-entry" th:attr="data-meal-id=${meal.id}">
                                <div class="timeline-time" th:text="${#temporals.format(meal.dateTime, 'h:mm a')}">Time</div>
                                <div class="timeline-content">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                                        <h4 class="timeline-title" th:text="${meal.mealName}">Meal Name</h4>
                                        <div class="meal-actions">
                                            <a href="javascript:void(0)" th:onclick="'editMeal(' + ${meal.id} + ')'" class="action-icon edit-icon" title="Edit Meal">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <a href="javascript:void(0)" th:onclick="'deleteMeal(' + ${meal.id} + ')'" class="action-icon delete-icon" title="Delete Meal">
                                                <i class="fas fa-trash-alt"></i>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="timeline-details" style="margin-bottom: 0.5rem;">
                                        <span><i class="fas fa-fire"></i> <span th:text="${meal.totalCalories}"></span> kcal</span>
                                    </div>
                                    <div class="meal-foods" style="font-size: 0.9em; color: #555;">
                                        <ul>
                                            <li th:each="foodItem : ${meal.foodItems}" style="margin-bottom: 3px;">
                                                <span th:text="${foodItem.foodItem}">Food Item</span> - 
                                                <span th:text="${foodItem.calories} + ' cal'">Calories</span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Meal Modal -->
    <div id="mealModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeMealModal()">&times;</span>
            <h2 id="modalTitle">Log New Meal</h2>
            <form id="mealForm" th:action="@{/user/savemeal}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" id="mealId">

                <div class="form-row">
                    <div class="form-group">
                        <label for="mealName">Meal Name</label>
                        <input type="text" name="mealName" id="mealName" placeholder="Enter meal name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="dateTime">Date and Time</label>
                        <input type="datetime-local" name="dateTime" id="dateTime" class="form-control" required>
                    </div>
                </div>
                
                <label>Foods</label>
                <div id="foodItemsContainer">
                    <div class="food-item-input">
                         <div class="form-row">
                            <div class="form-group">
                                <label>Food Item</label>
                                <input type="text" name="foodItems[0].foodItem" placeholder="Enter food" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Quantity</label>
                                <input type="number" name="foodItems[0].quantity" placeholder="Quantity" class="form-control" step="any">
                            </div>
                            <div class="form-group">
                                <label>Unit</label>
                                <select name="foodItems[0].unit" class="form-control">
                                    <option value="">None</option>
                                    <option value="g">Grams</option>
                                    <option value="kg">Kilograms</option>
                                    <option value="ml">Milliliters</option>
                                    <option value="l">Liters</option>
                                    <option value="cup">Cups</option>
                                    <option value="tbsp">Tablespoons</option>
                                    <option value="tsp">Teaspoons</option>
                                    <option value="oz">Ounce (oz)</option>
                                    <option value="serving">Serving</option>
                                    <option value="piece">Piece</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Calories</label>
                                <input type="number" name="foodItems[0].calories" placeholder="Calories" class="form-control" required>
                            </div>
                            <button type="button" class="remove-item" onclick="removeFoodItem(this)" style="align-self: flex-end; margin-bottom: 1rem;">×</button>
                        </div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 10px;">
                    <button type="button" class="btn btn-secondary" onclick="addFoodItem()">Add Food Item</button>
                    <button type="button" class="btn btn-warning" onclick="estimateAllCaloriesInModal()">Estimate Calories</button>
                    <button type="button" class="btn btn-secondary" onclick="closeMealModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Meal</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
