<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/Fitrack.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Fitness Analytics</title>
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo-container">
                <div class="logo"></div>
                <span class="site-name">Fitrack</span>
            </div>
            <ul class="nav-links">
                <li><a href="/user/dashboard">Dashboard</a></li>
                <li><a href="/user/analytics" class="active">Analytics</a></li>
                <li><a href="#">Workouts</a></li>
                <li><a href="#">Meals</a></li>
            </ul>
            <div class="user-info">
                <span th:text="${fullName}" class="user-name"></span>
                <div class="user-icon" onclick="toggleDropdown()"></div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <form id="logoutForm" action="/user/logout" method="post" style="display: none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="submit" value="Logout" />
                    </form>
                    <a href="#" onclick="document.getElementById('logoutForm').submit();">Logout</a>
                </div>
            </div>
        </header>

        <div class="analytics-container">
            <h1 class="analytics-title">Fitness Analytics</h1>
            
            <div class="analytics-grid">
                <div class="analytics-card">
                    <h2>Workout Frequency</h2>
                    <canvas id="workoutFrequencyChart"></canvas>
                </div>
                
                <div class="analytics-card">
                    <h2>Calories Burned</h2>
                    <canvas id="caloriesChart"></canvas>
                </div>

                <div class="analytics-card">
                    <h2>Body Composition</h2>
                    <div class="body-stats">
                        <div class="stat-item">
                            <span class="stat-label">Current Weight</span>
                            <span class="stat-value" th:text="${user.weight != null ? user.weight + ' kg' : '--'}">--</span>
                            <span class="stat-change" th:classappend="${weightProgress > 0 ? 'positive' : 'negative'}"
                                  th:text="${weightProgress != 0 ? (weightProgress > 0 ? '+' : '') + weightProgress + ' kg' : ''}"></span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">BMI</span>
                            <span class="stat-value" th:text="${user.weight != null && user.height != null ? #numbers.formatDecimal(bodyMeasurementService.calculateCurrentBMI(user), 1, 1) : '--'}">--</span>
                            <span class="stat-category" th:text="${user.weight != null && user.height != null ? '(' + bodyMeasurementService.getBMICategory(bodyMeasurementService.calculateCurrentBMI(user)) + ')' : ''}"></span>
                            <span class="stat-change" th:classappend="${bmiProgress > 0 ? 'positive' : 'negative'}"
                                  th:text="${bmiProgress != 0 ? (bmiProgress > 0 ? '+' : '') + #numbers.formatDecimal(bmiProgress, 1, 1) : ''}"></span>
                        </div>
                    </div>
                    <div class="add-measurement">
                        <a href="/user/measurements" class="primary">Add New Measurement</a>
                    </div>
                    <canvas id="bodyCompositionChart"></canvas>
                </div>

                <div class="analytics-card">
                    <h2>Progress Timeline</h2>
                    <div class="timeline">
                        <div th:each="measurement : ${measurements}" class="timeline-item">
                            <div class="timeline-date" th:text="${#temporals.format(measurement.dateTime, 'MMM dd')}"></div>
                            <div class="timeline-content">
                                <div class="timeline-metric">
                                    <span>Weight:</span>
                                    <span th:text="${measurement.weight} + ' kg'"></span>
                                </div>
                                <div th:if="${measurement.notes != null and not measurement.notes.isEmpty()}" class="timeline-notes">
                                    <span th:text="${measurement.notes}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const workoutData = /*[[${workoutData}]]*/ [];
        const caloriesData = /*[[${caloriesData}]]*/ [];
        const bodyMeasurements = /*[[${measurements}]]*/ [];
        
        // Workout Frequency Chart
        const workoutCtx = document.getElementById('workoutFrequencyChart').getContext('2d');
        new Chart(workoutCtx, {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Workouts',
                    data: workoutData,
                    backgroundColor: 'rgba(0, 122, 255, 0.5)',
                    borderColor: 'rgba(0, 122, 255, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });

        // Calories Chart
        const caloriesCtx = document.getElementById('caloriesChart').getContext('2d');
        new Chart(caloriesCtx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Calories Burned',
                    data: caloriesData,
                    fill: false,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Body Composition Chart
        const bodyCtx = document.getElementById('bodyCompositionChart').getContext('2d');
        const dates = bodyMeasurements.map(m => new Date(m.dateTime).toLocaleDateString());
        const weights = bodyMeasurements.map(m => m.weight);
        const bmi = bodyMeasurements.map(m => {
            const heightInMeters = m.user.height / 100;
            return m.weight / (heightInMeters * heightInMeters);
        });

        new Chart(bodyCtx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Weight (kg)',
                        data: weights,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        yAxisID: 'y'
                    },
                    {
                        label: 'BMI',
                        data: bmi,
                        borderColor: 'rgba(255, 159, 64, 1)',
                        yAxisID: 'y2'
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Weight (kg)'
                        }
                    },
                    y2: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'BMI'
                        },
                        grid: {
                            drawOnChartArea: false
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
