<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/Fitrack.css">
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo-container">
                <div class="logo"></div>
                <span class="site-name">Fitrack</span>
            </div>
            <ul class="nav-links">
                <li><a href="/user/dashboard">Fitrack</a></li>
                <li><a href="#">Workouts</a></li>
                <li><a href="#">Meals</a></li>
                <li><a href="#">Goals</a></li>
            </ul>
            <div class="user-info">
                <span th:text="${fullName}" class="user-name"></span>
                <div class="user-icon" onclick="toggleDropdown()"></div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <form id="logoutForm" action="/user/logout" method="post" style="display: none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="submit" value="Logout" />
                    </form>
                    <a href="#" onclick="document.getElementById('logoutForm').submit();">Logout</a>
                </div>
            </div>
        </header>
        <div class="form-container">
            <h1>Add Workout</h1>
            <form>
                <div class="form-group">
                    <label>Workout name</label>
                    <input type="text" placeholder="Enter workout name">
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label>Duration</label>
                        <input type="text" placeholder="Duration">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Repeat</label>
                        <input type="text" placeholder="Repeat">
                    </div>
                </div>

                <div class="form-group">
                    <label>Burned Calories</label>
                    <input></input>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="estimateBurnedCalories()" class="btn btn-warning">Estimate Calories</button>
                    <button type="submit" class="btn btn-primary">Save Workout</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
