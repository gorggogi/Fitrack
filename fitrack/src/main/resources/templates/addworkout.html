<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/Fitrack.css">
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo-container">
                <div class="logo"></div>
                <span class="site-name">Fitrack</span>
            </div>
            <ul class="nav-links">
                <li><a href="/user/dashboard">Fitrack</a></li>
                <li><a href="#">Workouts</a></li>
                <li><a href="#">Meals</a></li>
                <li><a href="#">Goals</a></li>
            </ul>
            <div class="user-info">
                <span th:text="${fullName}" class="user-name"></span>
                <div class="user-icon" onclick="toggleDropdown()"></div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <form id="logoutForm" action="/user/logout" method="post" style="display: none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="submit" value="Logout" />
                    </form>
                    <a href="#" onclick="document.getElementById('logoutForm').submit();">Logout</a>
                </div>
            </div>
        </header>
        <div class="form-container">
            <h1>Add Workout</h1>
            <form action="/user/saveworkout" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label>Workout name</label>
                    <input type="text" name="workoutName" id="workoutName" placeholder="Enter workout name" required>
                </div>
                <div class="form-group">
                    <label>Duration (minutes)</label>
                    <input type="number" name="duration" id="duration" placeholder="Duration" required>
                </div>
                <div class="form-group">
                    <label>Burned Calories</label>
                    <input type="number" name="burnedCalories" id="burnedCalories" placeholder="Burned Calories" required>
                </div>
                <div class="form-group">
                    <label>Repeat Days</label>
                    <div class="repeat-days">
                        <input type="checkbox" id="sunday" name="repeatDays" value="Sunday">
                        <label for="sunday">Sun</label>

                        <input type="checkbox" id="monday" name="repeatDays" value="Monday">
                        <label for="monday">Mon</label>

                        <input type="checkbox" id="tuesday" name="repeatDays" value="Tuesday">
                        <label for="tuesday">Tue</label>

                        <input type="checkbox" id="wednesday" name="repeatDays" value="Wednesday">
                        <label for="wednesday">Wed</label>

                        <input type="checkbox" id="thursday" name="repeatDays" value="Thursday">
                        <label for="thursday">Thu</label>

                        <input type="checkbox" id="friday" name="repeatDays" value="Friday">
                        <label for="friday">Fri</label>

                        <input type="checkbox" id="saturday" name="repeatDays" value="Saturday">
                        <label for="saturday">Sat</label>

                        <input type="checkbox" id="daily" name="repeatDays" value="Daily" checked>
                        <label for="daily">Daily</label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" onclick="estimateBurnedCalories()" class="btn btn-warning">Estimate Calories</button>
                    <button type="submit" class="btn btn-primary">Save Workout</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Get CSRF token from the hidden input
        const token = document.querySelector('input[name="_csrf"]').value;

        function estimateBurnedCalories() {
            const workoutName = document.getElementById('workoutName').value;
            const duration = document.getElementById('duration').value;

            if (!workoutName || !duration) {
                alert('Please enter both workout name and duration');
                return;
            }

            fetch('/workouts/estimate-calories', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': token  // Add CSRF token to headers
                },
                body: JSON.stringify({
                    workoutName: workoutName,
                    duration: parseFloat(duration)
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('burnedCalories').value = data.calories;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error estimating calories. Please try again.');
            });
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
