<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/Fitrack.css">
    <title>Body Measurements</title>
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="logo-container">
                <div class="logo"></div>
                <span class="site-name">Fitrack</span>
            </div>
            <ul class="nav-links">
                <li><a href="/user/dashboard">Dashboard</a></li>
                <li><a href="/user/analytics">Analytics</a></li>
                <li><a href="#">Workouts</a></li>
                <li><a href="#">Meals</a></li>
            </ul>
            <div class="user-info">
                <span th:text="${fullName}" class="user-name"></span>
                <div class="user-icon" onclick="toggleDropdown()"></div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <form id="logoutForm" action="/user/logout" method="post" style="display: none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="submit" value="Logout" />
                    </form>
                    <a href="#" onclick="document.getElementById('logoutForm').submit();">Logout</a>
                </div>
            </div>
        </header>

        <div class="form-container">
            <h1>Body Measurements</h1>
            
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible">
                <span th:text="${successMessage}">Success message</span>
                <button class="close-btn" onclick="this.parentElement.style.display='none';">&times;</button>
            </div>

            <form th:action="@{/user/measurements/save}" method="post" class="profile-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" name="weight" step="0.1" required
                           th:value="${currentWeight != null ? currentWeight : ''}">
                    <small class="form-text" th:if="${currentWeight != null}">Your current weight from your profile</small>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Optional)</label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Any additional notes about this measurement..."></textarea>
                </div>

                <button type="submit" class="primary">Save Measurement</button>
            </form>
        </div>
    </div>

    <script>
        function toggleDropdown() {
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
