<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> 
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" th:href="@{/styles/css/Join.css}">
    <script defer th:src="@{/styles/scripts/signup.js}"></script> <!-- ✅ JavaScript -->
</head>
<body>
	<div class="flex-container">
	<h1>Create your account</h1>
    <div class="form-container">
        <form th:action="@{/user/save}" method="post" th:object="${user}">
            <label>First Name:</label>
            <input type="text" th:field="*{firstName}" name="firstname" required>
            <label>Last Name:</label>
            <input type="text" th:field="*{lastName}" name="lastname" required>
            <label>Enter a valid email address:</label>
            <input type="email" th:field="*{email}" name="email" required>
            <br>
            <label>Create a strong password</label>
            <input type="password" th:field="*{password}" name="password" required>  
            <br>
            <label>Confirm Password</label>
            <input type="password" th:field="*{confirmPassword}" name="confirmPassword" required> 
            <br>

            <div>
                <input type="checkbox" id="termsCheckbox">
                <label for="termsCheckbox">I accept the <a th:href="@{/user/terms}">Terms and Conditions</a></label>
            </div>

 
            <p th:if="${error}" th:text="${error}" style="color: red;" id="signup-error"></p>
            <button type="submit" id="signupButton" disabled>Sign up</button>

            <p>Already have an account? <a th:href="@{/user/login}">Login here</a></p>
        </form>
    </div>
    </div>
</body>
</html>
