<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" th:href="@{/images/Fitrack.ico}">
    <title>Goals</title>
    <link rel="stylesheet" th:href="@{/styles/css/Fitrack.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Include dashboard.js if you need modals or other shared scripts -->
    <script th:src="@{/styles/scripts/dashboard.js}"></script> 
    <script th:src="@{/styles/scripts/all-goals.js}" defer></script>
</head>
<body>
    <div class="container">
        <div th:replace="~{header :: navbar}"></div>
        <div class="all-goals-container">
            <h1 class="trophies-main-title">Trophies</h1>

            <!-- Trophy Count -->
            <div class="trophy-count-display">
                <i class="fas fa-trophy fa-5x"></i> <!-- Larger trophy icon -->
                <span class="trophy-number" th:text="${totalCompletedGoalCount}">0</span>
            </div>

            <!-- Completed Goals Section -->
            <div class="goals-category-section">
                <h2 class="goals-category-title">Completed</h2>
                <div class="goals-list completed-goals-list">
                    <div th:if="${#lists.isEmpty(allGoals.?[status == 'COMPLETED'])}" class="goal-card empty-state">
                        <p>No completed goals yet.</p>
                    </div>
                    <div th:each="goal : ${allGoals.?[status == 'COMPLETED']}"
                         class="goal-card goal-completed-layout"
                         th:attr="data-goal-id=${goal.id}">
                        <i class="fas fa-trophy goal-card-icon"></i>
                        <span class="goal-card-status-text">Completed</span>
                        <span class="goal-card-description" th:text="${goal.description}">My weight journey</span>
                        <span class="goal-card-date" th:if="${goal.completionDate}" 
                              th:text="${#temporals.format(goal.completionDate, 'MM/dd/yy')}">08/10/25</span>
                    </div>
                </div>
            </div>

            <!-- Ongoing Goals Section -->
            <div class="goals-category-section">
                <h2 class="goals-category-title">Ongoing</h2>
                <div class="goals-list ongoing-goals-list">
                     <div th:if="${#lists.isEmpty(allGoals.?[status == 'IN_PROGRESS'])}" class="goal-card empty-state">
                        <p>No ongoing goals. Add a new one!</p>
                    </div>
                    <div th:each="goal : ${allGoals.?[status == 'IN_PROGRESS']}"
                         class="goal-card goal-ongoing-layout"
                         th:attr="data-goal-id=${goal.id},
                                  data-goal-name=${goal.description},
                                  data-goal-start-date=${goal.startDate != null ? #temporals.format(goal.startDate, 'MM/dd/yy') : 'N/A'},
                                  data-goal-type=${goal.goalType},
                                  data-goal-initial-value=${goal.startValue != null ? goal.startValue : 'N/A'},
                                  data-goal-achieved-value=${goal.currentValue != null ? goal.currentValue : 'N/A'},
                                  data-goal-target-value=${goal.targetValue != null ? goal.targetValue : 'N/A'}">
                        <i class="fas fa-spinner goal-card-icon-ongoing"></i>
                        <span class="goal-card-description" th:text="${goal.description}">My weight journey</span>
                        <span class="goal-card-date" th:if="${goal.targetDate}"
                              th:text="${#temporals.format(goal.targetDate, 'MM/dd/yy')}">08/10/25</span>
                        <!-- You might want to add progress bar or other details for ongoing goals here if needed -->
                    </div>
                </div>
            </div>

            <!-- Failed Goals Section (Optional - Not in image, but good to consider) -->
            <!-- 
            <div class="goals-category-section">
                <h2 class="goals-category-title">Past Attempts</h2>
                <div class="goals-list failed-goals-list">
                    <div th:each="goal : ${allGoals.?[status == 'FAILED']}" class="goal-card goal-failed-layout">
                        <i class="fas fa-times-circle goal-card-icon"></i>
                        <span class="goal-card-status-text">Failed</span>
                        <span class="goal-card-description" th:text="${goal.description}"></span>
                        <span class="goal-card-date" th:if="${goal.targetDate}" 
                              th:text="'Target: ' + ${#temporals.format(goal.targetDate, 'MM/dd/yy')}"></span>
                    </div>
                </div>
            </div>
            -->

        </div>
    </div>

    <!-- Completed Goal Detail Modal (Copied from dashboard.html - ensure it's included if not using fragments) -->
    <div id="completedGoalDetailModal" class="modal completed-goal-detail-modal">
        <div class="modal-content completed-goal-modal-content">
            <div class="completed-goal-icon-container">
                <i class="fas fa-trophy modal-trophy-icon"></i>
            </div>
            <h2 id="completedGoalNameModalText" class="completed-goal-name-text"></h2>
            <p id="completedGoalTypeModalText" class="completed-goal-info-text"></p>
            <p id="completedGoalTargetModalText" class="completed-goal-info-text"></p> <!-- Label changes in JS -->
            <p id="completedGoalAchievedModalText" class="completed-goal-info-text"></p>
            <p id="completedGoalSetDateText" class="completed-goal-info-text"></p>
            <div class="modal-actions completed-goal-actions">
                <button type="button" id="archiveGoalButton" class="btn btn-secondary archive-btn">archive goal</button>
                <button type="button" class="btn btn-primary close-btn-modal" onclick="closeCompletedGoalDetailModal()">close</button>
            </div>
        </div>
    </div>

</body>
</html>
