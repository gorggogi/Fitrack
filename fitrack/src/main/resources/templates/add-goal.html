<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Goal - Fitrack</title>
    <link rel="stylesheet" th:href="@{/styles/Fitrack.css}">
</head>
<body>
    <div class="container">
        <h1>Add New Goal</h1>
        
        <form th:action="@{/user/goals/add}" method="post" class="goal-form">
            <div class="form-group">
                <label for="goalType">Goal Type</label>
                <select id="goalType" name="goalType" required>
                    <option value="">Select a goal type</option>
                    <option value="WEIGHT">Weight</option>
                    <option value="EXERCISE">Exercise</option>
                    <option value="NUTRITION">Nutrition</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" required 
                       placeholder="e.g., Lose 5kg, Exercise 3 times per week, Maintain 2000 calories">
            </div>

            <div class="form-group">
                <label for="targetValue">Target Value</label>
                <input type="number" id="targetValue" name="targetValue" step="0.1" required
                       placeholder="e.g., 70 (kg), 3 (times per week), 2000 (calories)">
            </div>

            <div class="form-group">
                <label for="targetDate">Target Date</label>
                <input type="date" id="targetDate" name="targetDate" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Goal</button>
                <a th:href="@{/user/goals}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('targetDate').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
